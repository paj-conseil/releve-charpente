<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#1a3a5c;--blue-light:#e8f0f8;--blue-mid:#3a6fa8;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#1e293b;--text-muted:#64748b;--text-light:#94a3b8;
  --surface:#fff;--surface-1:#f8fafc;
  --red:#dc2626;--red-bg:#fef2f2;
  --green:#16a34a;--green-bg:#f0fdf4;
  --radius:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surface-1);color:var(--text);min-height:100dvh;overflow-x:hidden}
.app-header{background:var(--blue);color:white;padding:calc(var(--safe-top) + 12px) 16px 12px;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:10px}
.header-title{font-size:15px;font-weight:600;line-height:1.2}
.header-sub{font-size:11px;opacity:.75}
.stepper-wrap{background:var(--blue);padding:0 16px 12px}
.stepper{display:flex;gap:3px}
.step-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);transition:background .3s}
.step-dot.active{background:#60a5fa}
.step-dot.done{background:rgba(255,255,255,.6)}
.step-labels{display:flex;margin-top:5px}
.step-label{flex:1;font-size:10px;color:rgba(255,255,255,.6);text-align:center;transition:color .3s}
.step-label.active{color:white;font-weight:600}
.content{padding:14px;padding-bottom:calc(var(--safe-bottom) + 88px);max-width:600px;margin:0 auto}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.field-label{font-size:13px;color:var(--text-muted);margin-bottom:5px;display:block}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input-mic-row{display:flex;gap:8px;align-items:center}
.input-mic-row input{flex:1;font-size:16px;padding:11px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text);-webkit-appearance:none}
.input-mic-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.mic-inline{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.mic-inline svg{width:20px;height:20px;fill:var(--text-muted)}
.mic-inline.listening{background:var(--red-bg);border-color:var(--red);animation:pulse 1.2s infinite}
.mic-inline.listening svg{fill:var(--red)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
input[type=text],input[type=email],input[type=tel],input[type=number],select{font-size:16px;padding:11px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text);-webkit-appearance:none;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--border-strong);border-radius:20px;font-size:14px;cursor:pointer;color:var(--text-muted);background:var(--surface);transition:all .15s;user-select:none}
.chip.selected{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.vignettes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vignette{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 6px 8px;cursor:pointer;text-align:center;transition:all .2s;user-select:none;position:relative}
.vignette:active{transform:scale(.96)}
.vignette.selected{border-color:var(--accent);background:var(--accent-bg)}
.vignette svg{width:52px;height:42px;margin-bottom:4px}
.vignette-name{font-size:11px;font-weight:600;color:var(--text);line-height:1.2}
.vignette-count{position:absolute;top:6px;right:6px;background:var(--accent);color:white;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.elem-list{display:flex;flex-direction:column;gap:8px}
.elem-block{background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.elem-block-header{background:var(--blue-light);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.elem-block-name{font-size:13px;font-weight:700;color:var(--blue)}
.elem-block-add{background:none;border:none;color:var(--accent);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.elem-row{display:grid;grid-template-columns:auto auto auto auto auto 28px;gap:6px;align-items:center;padding:8px 12px;border-top:.5px solid var(--border)}
.elem-row-label{font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:2px}
.elem-col{display:flex;flex-direction:column;align-items:center}
.elem-col input{width:100%;font-size:14px;padding:6px 4px;text-align:center;border:1px solid var(--border);border-radius:6px}
.section-x{font-size:14px;font-weight:700;color:var(--text-muted);padding-top:16px}
.elem-surf{font-size:12px;font-weight:600;color:var(--accent);text-align:center;padding-top:16px;min-width:44px}
.elem-del{background:none;border:none;cursor:pointer;padding-top:14px;display:flex;align-items:flex-start;justify-content:center}
.elem-del svg{width:20px;height:20px;fill:var(--red)}
.add-more-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:var(--accent-bg);border:1.5px dashed var(--accent);border-radius:12px;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}

.toggle-switch{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border-strong);border-radius:26px;transition:.2s}
.toggle-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked+.toggle-slider{background:var(--accent)}
input:checked+.toggle-slider:before{transform:translateX(18px)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi-card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center}
.kpi-val{font-size:22px;font-weight:700;color:var(--accent);line-height:1}
.kpi-label{font-size:10px;color:var(--text-muted);margin-top:3px}
.synth-section{margin-bottom:16px}
.synth-section h3{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:2px solid var(--blue-light);margin-bottom:8px}
.synth-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:.5px solid var(--border)}

.synth-total .val{font-weight:700;color:var(--accent);font-size:16px}

.btn-next{flex:1;padding:13px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-size:15px;font-weight:600;cursor:pointer}

.new-btn{width:100%;padding:13px;background:var(--surface);color:var(--text-muted);border:1px solid var(--border-strong);border-radius:var(--radius);font-size:15px;cursor:pointer}

.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:12px;margin-bottom:10px;font-weight:500}
.sync-badge.ok{background:var(--green-bg);color:var(--green)}
.sync-badge.pending{background:#fefce8;color:#ca8a04}
.sync-badge.error{background:var(--red-bg);color:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--safe-bottom) + 20px);width:100%;max-width:500px;animation:slideUp .25s ease}

.modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:18px}
.section-inputs{display:flex;align-items:center;gap:10px;margin-bottom:16px}

.inj-row{display:flex;align-items:center;gap:10px;padding-top:8px}
.inj-row label{font-size:13px;color:var(--text-muted);white-space:nowrap}
.inj-row input{width:80px}

/* ── ADMIN ── */
.admin-wrap{padding:14px;max-width:900px;margin:0 auto;padding-bottom:40px}

.btn-view{padding:5px 12px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.btn-dl{padding:5px 12px;background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-left:4px}
.admin-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.admin-kpi{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.admin-kpi .n{font-size:20px;font-weight:700;color:var(--accent)}

.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.detail-sheet{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:20px}

.detail-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:.5px solid var(--border)}

.detail-row .l{color:var(--text-muted)}.detail-row .v{font-weight:600}
.detail-section{margin-bottom:14px}
.detail-section h3{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;border-bottom:1.5px solid var(--blue-light);margin-bottom:8px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:40px;margin-bottom:10px}
</style>

function saveState(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      step:state.step==='vignettes'?'vignettes':(typeof state.step==='number'?state.step:0),
      client:state.client, commercial:state.commercial,
      essence:state.essence, insectes:state.insectes,
      traitement:state.traitement, elements:state.elements,
      chantier:state.chantier, _idCounter:state._idCounter,
      lastSyncStatus:state.lastSyncStatus
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const saved=JSON.parse(raw);
    Object.assign(state,saved);
    if(!state.commercial)state.commercial={nom:'',agence:''};
    if(!state.client.email)state.client.email='';
    if(!state.client.tel)state.client.tel='';
    return true;
  }catch(e){return false;}
}
setInterval(saveState,3000);
document.addEventListener('visibilitychange',saveState);
window.addEventListener('pagehide',saveState);

// ─── SYNC QUEUE ───────────────────────────────────────────────────────────────
function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');}catch(e){return[];}}
function saveQueue(q){try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}catch(e){}}

async function syncToSupabase(payload){
  const res=await fetch(`${SUPA_URL}/rest/v1/releves`,{
    method:'POST',
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=minimal'
    },
    body:JSON.stringify(payload)
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  return true;
}

async function flushQueue(){
  const q=getQueue();
  if(q.length===0)return;
  const remaining=[];
  for(const item of q){
    try{await syncToSupabase(item);}
    catch(e){remaining.push(item);}
  }
  saveQueue(remaining);
}

window.addEventListener('online',()=>{flushQueue();});

async function submitReleve(payload){
  try{
    await syncToSupabase(payload);
    state.lastSyncStatus='ok';
    showToast('✓ Relevé enregistré et synchronisé');
  }catch(e){
    const q=getQueue();q.push(payload);saveQueue(q);
    state.lastSyncStatus='pending';
    showToast('Hors ligne — relevé sauvegardé, sync dès reconnexion');
  }
  saveState();
}

// ─── CALC ────────────────────────────────────────────────────────────────────
function rowSurf(el){
  const l=parseFloat(el.l)/100||0,h=parseFloat(el.h)/100||0,q=parseInt(el.qte)||0,m=parseFloat(el.ml)||0;
  return(l&&h&&q&&m)?2*(l+h)*m*q:0;
}
function calcTotals(){
  let surf=0,ml=0;
  state.elements.forEach(e=>{surf+=rowSurf(e);ml+=(parseInt(e.qte)||0)*(parseFloat(e.ml)||0);});
  return{surf,ml};
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg,duration=2800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),duration);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function go(n){
  if(state.rec){state.rec.stop();state.rec=null;state.listening=false;state.recTarget=null;}
  if(n==='vignettes'){
    state.step='vignettes';renderStepper();renderVignetteStep();
  } else {
    state.step=n;render();
  }
  saveState();window.scrollTo(0,0);
}

// ─── STEPPER ─────────────────────────────────────────────────────────────────
function renderStepper(){
  const stepNum=state.step==='vignettes'?2:(typeof state.step==='number'?state.step:0);
  document.getElementById('stepper').innerHTML=STEPS.map((_,i)=>{
    let c='step-dot';if(i<stepNum)c+=' done';else if(i===stepNum)c+=' active';
    return `<div class="${c}"></div>`;
  }).join('');
  document.getElementById('step-labels').innerHTML=STEPS.map((s,i)=>
    `<div class="step-label ${i===stepNum?'active':''}">${s}</div>`
  ).join('');
}

// ─── MIC ─────────────────────────────────────────────────────────────────────
function micBtn(id){
  return `<button class="mic-inline" id="mic-${id}" onclick="toggleMicField('${id}')" aria-label="Dicter">
    <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 14.93A7 7 0 0 1 5 9H3a9 9 0 0 0 8 8.94V20H8v2h8v-2h-3v-2.07A9 9 0 0 0 21 9h-2a7 7 0 0 1-6 6.93z"/></svg>
  </button>`;
}
function toggleMicField(targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Micro non disponible — utilisez Chrome');return;}
  if(state.rec&&state.recTarget===targetId){
    state.rec.stop();state.rec=null;state.listening=false;state.recTarget=null;updateMicBtns();return;
  }
  if(state.rec){state.rec.stop();state.rec=null;}
  const r=new SR();
  r.lang='fr-FR';r.continuous=false;r.interimResults=true;
  r.onresult=e=>{
    let final='',interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    const inp=document.getElementById(targetId);
    if(inp){inp.value=final||interim;inp.dispatchEvent(new Event('input'));}
  };
  r.onend=()=>{state.rec=null;state.listening=false;state.recTarget=null;updateMicBtns();};
  r.onerror=()=>{state.rec=null;state.listening=false;state.recTarget=null;updateMicBtns();};
  state.rec=r;state.listening=true;state.recTarget=targetId;r.start();updateMicBtns();
}
function updateMicBtns(){
  document.querySelectorAll('.mic-inline').forEach(b=>{
    b.classList.toggle('listening',state.listening&&state.recTarget===b.id.replace('mic-',''));
  });
}

          </div>
        </div>

          <label>ML/u. (longueur unitaire en mètres)</label>

function closeModalOutside(e){if(e.target===e.currentTarget)closeModal();}
function closeModal(){document.getElementById('modal-container').innerHTML='';}
function validateModal(nom){
  const l=document.getElementById('m-larg').value;
  const h=document.getElementById('m-haut').value;
  const ml=document.getElementById('m-ml').value;
  const qte=document.getElementById('m-qte').value;
  if(!l||!h||!qte){showToast('Section et quantité obligatoires');return;}
  state.elements.push({id:newId(),nom,l,h,ml:ml||'',qte});
  closeModal();renderVignetteStep();saveState();
  showToast(`✓ ${nom} ajouté`);
}

        ${ELEM_NAMES.map(name=>{

function goToElemList(){
  if(state.elements.length===0){showToast('Ajoutez au moins un élément');return;}
  go(2);
}

// ─── ELEM ────────────────────────────────────────────────────────────────────
function updateElem(id,field,val){
  const el=state.elements.find(e=>e.id===id);
  if(!el)return;
  el[field]=val;
  const s=rowSurf(el);
  const sd=document.getElementById('surf-'+id);
  if(sd)sd.textContent=s>0?s.toFixed(2)+' m²':'—';
  saveState();
}
function deleteElem(id){
  if(!confirm('Supprimer cette ligne ?'))return;
  state.elements=state.elements.filter(e=>e.id!==id);
  saveState();render();
}
function toggleInsecte(name,el){
  const idx=state.insectes.indexOf(name);
  if(idx>=0){if(state.insectes.length===1){showToast('Au moins un insecte requis');return;}state.insectes.splice(idx,1);el.classList.remove('selected');}
  else{state.insectes.push(name);el.classList.add('selected');}
}
function toggleInj(){
  const d=document.getElementById('inj-detail');
  if(d)d.style.display=state.chantier.injecteurs?'':'none';
}

// ─── NEW RELEVE ───────────────────────────────────────────────────────────────
function newReleve(){
  if(!confirm('Commencer un nouveau relevé ? Les données actuelles seront effacées.'))return;
  state.step=0;state._idCounter=0;
  state.client={nom:'',adresse:'',cp:'',ville:'',email:'',tel:''};
  state.commercial={nom:state.commercial.nom,agence:state.commercial.agence}; // keep commercial info
  state.essence='Résineux';state.insectes=['Capricorne'];state.traitement='Curatif';
  state.elements=[];
  state.chantier={eau:false,elec:false,sol:false,parking:false,hauteur:'',injecteurs:false,nbInj:'',tourillon:false,buchage:'Faible',echaf:false};
  state.lastSyncStatus='none';
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  render();
}

// ─── VALIDATE & SUBMIT ───────────────────────────────────────────────────────
async function validerReleve(){
  const {surf,ml}=calcTotals();
  const payload={
    commercial_nom:state.commercial.nom||null,
    commercial_agence:state.commercial.agence||null,
    client_nom:state.client.nom||null,
    client_adresse:[state.client.adresse,state.client.cp,state.client.ville].filter(Boolean).join(', ')||null,
    client_cp:state.client.cp||null,
    client_ville:state.client.ville||null,
    client_email:state.client.email||null,
    client_tel:state.client.tel||null,
    essence:state.essence,
    insectes:state.insectes.join(', '),
    traitement:state.traitement,
    elements:state.elements,
    chantier:state.chantier,
    surface_totale:parseFloat(surf.toFixed(2)),
    ml_total:parseFloat(ml.toFixed(2)),
  };
  await submitReleve(payload);
  go(4);
}

async function renderAdmin(){
  // Hide normal UI
  document.querySelector('.app-header').style.display='none';
  document.querySelector('.stepper-wrap').style.display='none';
  document.getElementById('content').style.display='none';
  document.getElementById('nav-bar').style.display='none';

  const wrap=document.createElement('div');
  wrap.id='admin-root';
  wrap.innerHTML=`<div class="admin-wrap">
    <div class="admin-header">
      <div class="admin-title">🗂 Tableau de bord — Relevés PCP</div>
      <button onclick="exportAdminCSV(window._adminData)" style="padding:8px 16px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer">⬇ Export CSV</button>
    </div>
    <div id="admin-kpis" class="admin-kpis"></div>
    <div class="admin-filters">
      <input type="text" id="f-search" placeholder="Rechercher client, commercial…" oninput="filterAdmin()">

      <select id="f-commercial" onchange="filterAdmin()"><option value="">Tous les commerciaux</option></select>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Date</th><th>Client</th><th>Agence</th><th>Commercial</th>
          <th>Surface (m²)</th><th>ML</th><th>Sync</th><th>Actions</th>
        </tr></thead>
        <tbody id="admin-tbody"><tr><td colspan="8" style="text-align:center;padding:30px;color:#94a3b8">Chargement…</td></tr></tbody>
      </table>
    </div>
  </div>`;
  document.body.appendChild(wrap);

  // Load data
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/releves?select=*&order=created_at.desc&limit=500`,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    const data=await res.json();
    window._adminData=data;
    populateAdminFilters(data);
    renderAdminTable(data);
    renderAdminKpis(data);
  }catch(e){
    document.getElementById('admin-tbody').innerHTML=`<tr><td colspan="8" style="text-align:center;padding:30px;color:#dc2626">Erreur de chargement : ${e.message}</td></tr>`;
  }

  // Also show pending queue
  const q=getQueue();
  if(q.length>0){
    const pending=document.createElement('div');
    pending.style.cssText='background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin:0 14px 12px;font-size:13px;color:#854d0e';
    pending.innerHTML=`⏳ ${q.length} relevé(s) en attente de synchronisation (hors ligne)`;
    document.getElementById('admin-root').querySelector('.admin-wrap').prepend(pending);
  }
}

function populateAdminFilters(data){
  const agences=[...new Set(data.map(r=>r.commercial_agence).filter(Boolean))].sort();
  const commerciaux=[...new Set(data.map(r=>r.commercial_nom).filter(Boolean))].sort();
  const fa=document.getElementById('f-agence');
  agences.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;fa.appendChild(o);});
  const fc=document.getElementById('f-commercial');
  commerciaux.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;fc.appendChild(o);});
}

function filterAdmin(){
  const search=document.getElementById('f-search').value.toLowerCase();
  const agence=document.getElementById('f-agence').value;
  const commercial=document.getElementById('f-commercial').value;
  const filtered=(window._adminData||[]).filter(r=>{
    const matchSearch=!search||
      (r.client_nom||'').toLowerCase().includes(search)||
      (r.commercial_nom||'').toLowerCase().includes(search)||
      (r.client_ville||'').toLowerCase().includes(search);
    const matchAgence=!agence||(r.commercial_agence||'')==agence;
    const matchComm=!commercial||(r.commercial_nom||'')==commercial;
    return matchSearch&&matchAgence&&matchComm;
  });
  renderAdminTable(filtered);
  renderAdminKpis(filtered);
}

function exportAdminCSV(data){

    r.surface_totale!=null?r.surface_totale.toFixed(2):'',
    r.ml_total!=null?r.ml_total.toFixed(2):''
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'));
  const csv='\uFEFF'+[headers.join(';'),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});

  const a=document.createElement('a');
